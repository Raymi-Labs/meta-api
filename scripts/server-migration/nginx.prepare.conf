# Preparation endpoint only; no public listener, proxy, certificate or DNS change.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;
    default_type text/plain;

    location = /healthz {
        return 200 "newapi migration environment prepared; production inactive\n";
    }
    location / {
        return 503 "New API migration target is not active\n";
    }
}
