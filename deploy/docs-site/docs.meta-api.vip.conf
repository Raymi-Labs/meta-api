# Independent static documentation. Does not expose application/auth/relay routes.
server {
    listen 80;
    listen [::]:80;
    server_name docs.meta-api.vip;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/newapi-docs/acme;
    }
    location / { return 301 https://docs.meta-api.vip$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.meta-api.vip;
    ssl_certificate /etc/letsencrypt/live/docs.meta-api.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.meta-api.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/newapi-docs/current;
    index index.html;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /api/status { include /etc/nginx/snippets/newapi-docs-public-api.conf; }
    location = /api/pricing { include /etc/nginx/snippets/newapi-docs-public-api.conf; }
    location ~ ^/(api|v1|v1beta|console|login|register)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /docs-images/ { try_files $uri =404; expires 1d; }
    location = /build-info.json { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
