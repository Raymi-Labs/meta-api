server {
    listen 80;
    listen [::]:80;
    server_name meta-api.com;
    access_log /var/log/nginx/meta-api-com.access.log;
    error_log /var/log/nginx/meta-api-com.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/meta-api-com-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://meta-api.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name meta-api.com;

    ssl_certificate /etc/letsencrypt/live/meta-api.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meta-api.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/meta-api-com.access.log;
    error_log /var/log/nginx/meta-api-com.error.log;

    client_max_body_size 100m;

    location = /relay-monitor { return 302 /relay-monitor/; }
    location ^~ /relay-monitor/ {
        alias /var/lib/relay-monitor/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass https://meta_nan_origin;

        # NewAPI 源站 HTTPS/SNI
        proxy_ssl_server_name on;
        proxy_ssl_name nan.meta-api.vip;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        proxy_http_version 1.1;

        # 源站实际虚拟主机
        proxy_set_header Host nan.meta-api.vip;

        # 对外访问域名
        proxy_set_header X-Forwarded-Host meta-api.com;
        proxy_set_header X-Forwarded-Proto https;

        # 客户端 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $meta_connection_upgrade;

        # NewAPI / SSE 流式输出
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 防止源站返回 nan.meta-api.vip
        proxy_redirect https://nan.meta-api.vip/ https://meta-api.com/;
        proxy_cookie_domain nan.meta-api.vip meta-api.com;
    }
}
