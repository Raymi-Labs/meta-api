name: Build Electron App

on:
  push:
    tags:
      - '*'  # Triggers on version tags like v1.0.0
      - '!*-*'  # Ignore pre-release tags like v1.0.0-beta
      - '!*-alpha*' # Ignore alpha tags like v1.0.0-alpha
      - '!cn-tunnel-*' # Published independently by cn-tunnel.yml
      - '!agent-workflow-*' # Published independently by agent-workflow.yml
      - '!project-decision-kit-*' # Published independently by agent-workflow.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已有正式应用标签，例如 v1.12.7'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: electron-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        # os: [macos-latest, windows-latest]
        os: [windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release source
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$(tr -d '\r\n' < VERSION)" == "$RELEASE_TAG" ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]] || exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'

      - name: Build frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$RELEASE_TAG" bun run build
          cd ..

      # - name: Build Go binary (macos/Linux)
      #   if: runner.os != 'Windows'
      #   run: |
      #     go mod download
      #     go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$(git describe --tags)' -extldflags '-static'" -o new-api

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        run: |
          go mod download
          VERSION="$RELEASE_TAG"
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o new-api.exe
          test "$(./new-api.exe --version)" = "$VERSION"

      - name: Update Electron version
        run: |
          cd electron
          VERSION="$RELEASE_TAG"
          VERSION=${VERSION#v}  # Remove 'v' prefix if present
          # Convert to valid semver: take first 3 components and convert rest to prerelease format
          # e.g., 0.9.3-patch.1 -> 0.9.3-patch.1
          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            REST=${BASH_REMATCH[4]}
          
            VERSION="$MAJOR.$MINOR.$PATCH"
          
            # If there's extra content, append it without adding -dev
            if [[ -n "$REST" ]]; then
              VERSION="$VERSION$REST"
            fi
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      # - name: Build Electron app (macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     cd electron
      #     npm run build:mac
      #   env:
      #     CSC_IDENTITY_AUTO_DISCOVERY: false  # Skip code signing

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: |
          cd electron
          npm run build:win -- --x64 --publish never
          test "$(./dist/win-unpacked/resources/bin/new-api.exe -version)" = "$RELEASE_TAG"
          node -e 'const a=require("@electron/asar"); const p=JSON.parse(a.extractFile("dist/win-unpacked/resources/app.asar", "package.json")); if (p.version !== process.env.RELEASE_TAG.slice(1)) throw Error("打包应用版本不匹配");'
          test -s "dist/New-API-App Setup ${RELEASE_TAG#v}.exe"
          test -s "dist/New-API-App ${RELEASE_TAG#v}.exe"
          cd dist
          sha256sum --binary ./*.exe > "New-API-App-${RELEASE_TAG#v}-windows.sha256"

      # - name: Upload artifacts (macOS)
      #   if: runner.os == 'macOS'
      #   uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      #   with:
      #     name: macos-build
      #     path: |
      #       electron/dist/*.dmg
      #       electron/dist/*.zip

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build
          if-no-files-found: error
          path: |
            electron/dist/*.exe
            electron/dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4

      - name: Add desktop assets to existing Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYUPLOAD'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import time
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          version = tag.removeprefix('v')
          names = [f'New-API-App Setup {version}.exe', f'New-API-App {version}.exe',
                   f'New-API-App-{version}-windows.sha256']
          files = [Path('windows-build') / name for name in names]
          for path in files:
              if not path.is_file() or path.stat().st_size == 0:
                  raise RuntimeError(f'缺少桌面附件: {path.name}')
          expected_checksums = {
              f'./{path.name}': hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files[:2]
          }
          checksums = {}
          for line in files[2].read_text().splitlines():
              # GNU sha256sum uses '*' for binary mode on Windows, ' ' for text.
              match = re.fullmatch(r'([0-9a-fA-F]{64}) [ *](.+)', line)
              if not match or match[2] in checksums:
                  raise RuntimeError('桌面附件校验文件格式无效或重复')
              checksums[match[2]] = match[1].lower()
          if checksums != expected_checksums:
              raise RuntimeError('桌面附件校验和不匹配')
          required = {f'new-api-{tag}', f'new-api-arm64-{tag}'}
          for attempt in range(60):
              try:
                  release = json.loads(subprocess.check_output([
                      'gh', 'release', 'view', tag, '--repo', repo, '--json', 'isDraft,assets',
                  ], text=True, timeout=30))
                  complete = {a['name'] for a in release['assets']
                              if a['state'] == 'uploaded' and a['size'] > 0}
                  if not release['isDraft'] and required <= complete:
                      break
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  pass
              time.sleep(10)
          else:
              raise RuntimeError('Linux Release尚未完整发布，桌面附件保留在Actions artifact中，可重跑上传')
          # Validate every collision before uploading anything. Never overwrite a release.
          for name in names:
              existing = [a for a in release['assets'] if a['name'] == name]
              if existing and (len(existing) != 1 or existing[0]['state'] != 'uploaded' or existing[0]['size'] <= 0):
                  raise RuntimeError(f'已有附件不完整，拒绝覆盖: {name}')
          if not set(names) <= complete:
              # A new build can differ from a partially uploaded earlier build.
              # Only complete a matching artifact set, never mix its checksums.
              for path in files:
                  existing = next((a for a in release['assets'] if a['name'] == path.name), None)
                  digest = f'sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}'
                  if existing and existing.get('digest') != digest:
                      raise RuntimeError(f'已有附件与本次构建不同，需使用原Actions artifact补传: {path.name}')
          for path in files:
              if path.name in complete:
                  print(f'保留已有附件: {path.name}')
                  continue
              subprocess.run(['gh', 'release', 'upload', tag, str(path), '--repo', repo], check=True)
          PYUPLOAD
