name: Invoice PDF checks

on:
  push:
    branches: [main]
    paths:
      - 'service/invoice_pdf*'
      - 'controller/invoice*.go'
      - 'model/invoice*.go'
      - 'router/api-router.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'web/src/helpers/invoicePdf.js'
      - 'web/src/components/topup/modals/TopupHistoryModal.jsx'
      - 'web/scripts/invoice-pdf*'
      - '.github/workflows/invoice-pdf.yml'
  pull_request:
    paths:
      - 'service/invoice_pdf*'
      - 'controller/invoice*.go'
      - 'model/invoice*.go'
      - 'router/api-router.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'web/src/helpers/invoicePdf.js'
      - 'web/src/components/topup/modals/TopupHistoryModal.jsx'
      - 'web/scripts/invoice-pdf*'
      - '.github/workflows/invoice-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  invoice-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install print fonts and check browser
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          /usr/bin/google-chrome --version
      - name: Check PDF isolation and invoice attachments
        env:
          INVOICE_PDF_INTEGRATION: '1'
          INVOICE_PDF_CHROME_PATH: /usr/bin/google-chrome
        run: go test ./service ./controller ./model ./common -run 'Invoice|Email' -count=1
