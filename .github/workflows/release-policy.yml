name: Release pipeline checks

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - '.github/workflows/electron-build.yml'
      - 'scripts/release/**'
      - '.github/workflows/release*.yml'
      - '.github/workflows/docker-*.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - '.github/workflows/electron-build.yml'
      - 'scripts/release/**'
      - '.github/workflows/release*.yml'
      - '.github/workflows/docker-*.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Check release boundaries
        run: |
          bun scripts/release/check-policy.mjs
          python3 -B -m unittest discover -s scripts/release -p 'test_*.py' -v
          bash -n scripts/release/verify-image.sh
      - name: Check Docker build graph
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
          docker buildx build --call=check .
          docker buildx build --call=check --build-arg FRONTEND_SOURCE=frontend-prebuilt .
      - name: Check workflow syntax
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            .github/workflows/release.yml .github/workflows/release-optional.yml \
            .github/workflows/release-policy.yml .github/workflows/docker-image-arm64.yml \
            .github/workflows/electron-build.yml .github/workflows/release-frontend.yml \
            .github/workflows/docker-publish.yml
