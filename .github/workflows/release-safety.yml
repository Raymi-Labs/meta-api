name: Release tooling safety

on:
  push:
    branches: [main]
    paths:
      - 'scripts/newapi-release'
      - 'scripts/meta-api'
      - 'scripts/server-release/**'
      - 'scripts/server-storage/**'
      - 'scripts/server-migration/**'
      - '.github/workflows/release-safety.yml'
  pull_request:
    paths:
      - 'scripts/newapi-release'
      - 'scripts/meta-api'
      - 'scripts/server-release/**'
      - 'scripts/server-storage/**'
      - 'scripts/server-migration/**'
      - '.github/workflows/release-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Bash syntax
        run: |
          for script in scripts/meta-api scripts/newapi-release scripts/server-release/retired-entrypoint.sh scripts/server-release/release-test-harness.bash scripts/server-storage/newapi-mysql-full-backup.sh; do
            bash -n "$script"
          done
      - name: Exercise isolated failure recovery
        run: python3 -B -m unittest discover -s scripts/server-release -p 'test_*.py' -v
      - name: Verify application-free migration preparation without starting containers
        env:
          NEWAPI_PREPARATION_COMPOSE_TEST: '1'
        run: |
          python3 -B -m unittest discover -s scripts/server-migration -p 'test_*.py' -v
      - name: Exercise storage retention and verified log offload
        run: python3 -B -m unittest discover -s scripts/server-storage -p 'test_*.py' -v
      - name: Exercise real MySQL snapshot locks and cancellation
        timeout-minutes: 5
        env:
          NEWAPI_PITR_TEST_MYSQL_IMAGE: mysql:8.0.46
          NEWAPI_PITR_TEST_DELAY_LIBRARY: /tmp/newapi-pitr-delay.so
        run: |
          gcc -shared -fPIC -O2 scripts/server-storage/test_pitr_delay.c -o "$NEWAPI_PITR_TEST_DELAY_LIBRARY" -ldl
          python3 -B -m unittest discover -s scripts/server-storage -p 'test_pitr_anchor.py' -v
      - name: Verify permanent migration seed and native MySQL replication filters
        timeout-minutes: 10
        env:
          NEWAPI_MIGRATION_DOCKER_TEST: '1'
        run: python3 -B -m unittest discover -s scripts/server-migration -p 'test_mysql_target_seed.py' -v
      - name: Verify Redis RDB import, absolute expiration and AOF crash recovery
        timeout-minutes: 10
        env:
          NEWAPI_REDIS_MIGRATION_IMAGE: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        run: |
          docker pull "$NEWAPI_REDIS_MIGRATION_IMAGE"
          python3 -B -m unittest discover -s scripts/server-migration -p 'test_redis_migration.py' -v
      - name: Install isolated encryption, socket transport and boot verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rclone socat systemd
      - name: Verify private MySQL socket binary transport and both half-close directions
        run: |
          test -x /usr/bin/socat
          python3 -B -m unittest discover -s scripts/server-migration -p 'test_pulse_logdb_proxy.py' -v
      - name: Verify private socket boot ordering in an isolated systemd root
        run: |
          test -x /usr/bin/systemd-analyze
          python3 -B -m unittest discover -s scripts/server-migration -p 'test_pulse_socket_units.py' -v
      - name: Verify encryption and retirement with a temporary local backend
        run: sudo env NEWAPI_RCLONE_INTEGRATION=1 python3 -B -m unittest discover -s scripts/server-storage -p 'test_log_offload_rclone.py' -v
      - name: Check opt-in Docker exercise entrypoint
        run: |
          python3 -B scripts/server-release/exercise-directory.py --help
          python3 -B scripts/server-release/migrate-deployment-directory.py --help
          python3 -B scripts/server-release/exercise-restart.py --help
          python3 -B scripts/server-release/exercise-migration.py --help
      - name: Build exact MySQL PITR recovery tools
        run: docker build -t newapi-pitr-tools:8.0.46 -f scripts/server-storage/Dockerfile.pitr-tools .
      - name: Verify directory exchange with an isolated MySQL bind mount
        timeout-minutes: 5
        run: sudo python3 -B scripts/server-release/exercise-directory.py --execute --fixture-image newapi-pitr-tools:8.0.46
      - name: Verify frozen cutover audit against a real 76-table schema
        timeout-minutes: 10
        env:
          NEWAPI_FINAL_AUDIT_MYSQL_IMAGE: newapi-pitr-tools:8.0.46
        run: python3 -B -m unittest discover -s scripts/server-migration -p 'test_mysql_final_audit.py' -v
      - name: Exercise archive event boundary under the production memory limit
        timeout-minutes: 20
        run: |
          docker build -t newapi-pitr-archive-test -f scripts/server-storage/Dockerfile.pitr-archive-test .
          docker run --rm --network none --memory=768m --memory-swap=768m --user "$(id -u):$(id -g)" -v "$PWD/scripts/server-storage:/workspace:ro" newapi-pitr-archive-test
      - name: Restore full snapshot and real binlogs against an independent target snapshot
        timeout-minutes: 20
        run: python3 -B scripts/server-storage/integration_pitr.py
