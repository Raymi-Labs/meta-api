name: Release tooling safety

on:
  push:
    branches: [main]
    paths:
      - 'scripts/newapi-release'
      - 'scripts/server-release/**'
      - '.github/workflows/release-safety.yml'
  pull_request:
    paths:
      - 'scripts/newapi-release'
      - 'scripts/server-release/**'
      - '.github/workflows/release-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          for script in scripts/newapi-release scripts/server-release/retired-entrypoint.sh scripts/server-release/release-test-harness.bash; do
            bash -n "$script"
          done
      - name: Exercise isolated failure recovery
        run: python3 -B -m unittest discover -s scripts/server-release -p 'test_*.py' -v
      - name: Check opt-in Docker exercise entrypoint
        run: python3 -B scripts/server-release/exercise-restart.py --help
