name: Portable Agent Workflow
on:
  push:
    branches: ['**']
    paths:
      - 'scripts/agent-workflow/**'
      - '.agents/skills/write-notes-like-deepseek/**'
      - '.github/workflows/agent-workflow.yml'
    tags: ['agent-workflow-v*']
  pull_request:
    paths:
      - 'scripts/agent-workflow/**'
      - '.agents/skills/write-notes-like-deepseek/**'
      - '.github/workflows/agent-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: python -m unittest discover -s scripts/agent-workflow/tests -v
  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "agent-workflow-v$(cat scripts/agent-workflow/VERSION)"
          fi
          python3 scripts/agent-workflow/build.py dist-agent-workflow
      - uses: actions/upload-artifact@v4
        with:
          name: agent-workflow
          path: dist-agent-workflow/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/agent-workflow-v')
        with:
          name: 项目工作流迁移包 ${{ github.ref_name }}
          body_path: scripts/agent-workflow/CHANGELOG.md
          make_latest: false
          fail_on_unmatched_files: true
          files: dist-agent-workflow/*
