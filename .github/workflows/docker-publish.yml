name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 强制 JavaScript actions 使用 Node.js 24，提前规避 2026-06-02 之后
# GitHub 弃用 Node.js 20 的告警与运行风险（涉及 actions/checkout@v4、
# docker/setup-buildx-action@v3、docker/login-action@v3、docker/build-push-action@v6 等）。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_build: ${{ steps.gate.outputs.release_build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Reuse exact tagged release
        id: gate
        run: python3 scripts/release/main-release-gate.py
  docker:
    needs: prepare
    if: needs.prepare.outputs.release_build != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image metadata
        shell: bash
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BUILD_BRANCH=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Pull BuildKit image with retry
        shell: bash
        run: |
          for i in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && exit 0
            sleep $((i * 10))
          done
          docker pull moby/buildkit:buildx-stable-1

      - name: Set up Docker Buildx
        run: docker buildx create --driver docker-container --use --bootstrap

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        run: |
          docker buildx build --push --platform linux/amd64 \
            --tag "${IMAGE_NAME}:latest" --tag "${IMAGE_NAME}:sha-${SHORT_SHA}" \
            --cache-from "type=registry,ref=${IMAGE_NAME}:buildcache-main" \
            --cache-to "type=registry,ref=${IMAGE_NAME}:buildcache-main,mode=max" \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "GOPROXY=https://proxy.golang.org,direct" \
            --build-arg "GOSUMDB=sum.golang.org" \
            --build-arg "APP_VERSION=${APP_VERSION}" \
            --build-arg "BUILD_COMMIT=${GITHUB_SHA}" \
            --build-arg "BUILD_REPOSITORY=${GITHUB_REPOSITORY}" \
            --build-arg "BUILD_BRANCH=${BUILD_BRANCH}" .
