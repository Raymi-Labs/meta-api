name: Publish Docker image (Multi-arch, GHCR + optional Docker Hub)

on:
  push:
    tags:
      - '*-alpha*'
      - '!cn-tunnel-*'
      - '!agent-workflow-*'
      - '!project-decision-kit-*'
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      frontend_artifact:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string

# GitHub-hosted runners currently execute JavaScript actions with Node 24.
# Keep the workflow explicit so the release does not depend on the runner's
# temporary Node 20 compatibility setting.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag & write VERSION
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag || '' }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            TAG="$REQUESTED_TAG"
            # Verify tag exists
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Error: Tag '$TAG' does not exist in the repository"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "$TAG" > VERSION
          echo "Building tag: $TAG for ${{ matrix.arch }}"


      - name: Checkout current release tools
        if: inputs.frontend_artifact != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          sparse-checkout: scripts/release
      - name: Download shared frontend
        if: inputs.frontend_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.frontend_artifact }}
          path: .release-artifact
      - name: Restore verified frontend
        if: inputs.frontend_artifact != ''
        run: python3 .release-tools/scripts/release/frontend-artifact.py restore --directory .release-artifact --version "$TAG"

      - name: Normalize GHCR repository
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        run: docker buildx create --driver docker-container --use --bootstrap

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials are not configured; publishing to GHCR only."
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Prepare image tags
        id: tags
        env:
          DOCKERHUB_ENABLED: ${{ steps.dockerhub.outputs.enabled }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE_NAME}:${TAG}-${{ matrix.arch }}"
            echo "${IMAGE_NAME}:latest-${{ matrix.arch }}"
            if [[ "$DOCKERHUB_ENABLED" == 'true' ]]; then
              echo "calciumion/new-api:${TAG}-${{ matrix.arch }}"
              echo "calciumion/new-api:latest-${{ matrix.arch }}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build & push single-arch (GHCR + optional Docker Hub)
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          FRONTEND_ARTIFACT: ${{ inputs.frontend_artifact }}
        run: |
          frontend_args=()
          if [[ -n "$FRONTEND_ARTIFACT" ]]; then
            frontend_args+=(--build-arg FRONTEND_SOURCE=frontend-prebuilt)
          fi
          tags=()
          while IFS= read -r image_tag; do
            [[ -z "$image_tag" ]] || tags+=(--tag "$image_tag")
          done <<< "$IMAGE_TAGS"
          docker buildx build --push --platform "$TARGET_PLATFORM" \
            "${tags[@]}" "${frontend_args[@]}" --provenance=false --sbom=false \
            --cache-from "type=registry,ref=${IMAGE_NAME}:buildcache-${TARGET_ARCH}" \
            --cache-to "type=registry,ref=${IMAGE_NAME}:buildcache-${TARGET_ARCH},mode=max" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${BUILD_COMMIT}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --build-arg "GOPROXY=https://proxy.golang.org,direct" \
            --build-arg "GOSUMDB=sum.golang.org" \
            --build-arg "BUILD_COMMIT=${BUILD_COMMIT}" \
            --build-arg "BUILD_REPOSITORY=${GITHUB_REPOSITORY}" \
            --build-arg "BUILD_BRANCH=${TAG}" .

      - name: Verify image architecture and version
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}:${{ env.TAG }}-${{ matrix.arch }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash scripts/release/verify-image.sh "$IMAGE_REF" "$TAG" "$TARGET_ARCH"

  create_manifests:
    name: Create multi-arch manifests (GHCR + optional Docker Hub)
    needs: [build_single_arch]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || '' }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            echo "TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Normalize GHCR repository
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Create & push manifest (GHCR - version)
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${TAG}" \
            "${IMAGE_NAME}:${TAG}-amd64" \
            "${IMAGE_NAME}:${TAG}-arm64"

      - name: Create & push manifest (GHCR - latest)
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${TAG}-amd64" \
            "${IMAGE_NAME}:${TAG}-arm64"

      - name: Create & push manifest (Docker Hub - version)
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          docker buildx imagetools create \
            -t "calciumion/new-api:${TAG}" \
            "calciumion/new-api:${TAG}-amd64" \
            "calciumion/new-api:${TAG}-arm64"

      - name: Create & push manifest (Docker Hub - latest)
        if: steps.dockerhub.outputs.enabled == 'true'
        run: |
          docker buildx imagetools create \
            -t "calciumion/new-api:latest" \
            "calciumion/new-api:${TAG}-amd64" \
            "calciumion/new-api:${TAG}-arm64"

      - name: Publish same-commit SHA image
        if: github.event_name == 'push'
        env:
          BUILD_COMMIT: ${{ needs.build_single_arch.outputs.commit }}
        run: |
          [[ "$BUILD_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:sha-${BUILD_COMMIT:0:7}" \
            "${IMAGE_NAME}:${TAG}-amd64" \
            "${IMAGE_NAME}:${TAG}-arm64"
