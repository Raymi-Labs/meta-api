name: Release (Linux)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
      release_tag:
        description: '已有应用标签，补齐 Linux 附件并保留发布状态'
        required: false
        type: string
  push:
    tags:
      - '*'
      - '!*-alpha*'
      - '!cn-tunnel-*' # Published independently by cn-tunnel.yml
      - '!agent-workflow-*' # Published independently by agent-workflow.yml
      - '!project-decision-kit-*' # Published independently by agent-workflow.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Determine Version
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
            [[ "$REQUESTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
            [[ "$(tr -d '\r\n' < VERSION)" == "$REQUESTED_RELEASE_TAG" ]] || exit 1
            VERSION="$REQUESTED_RELEASE_TAG"
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$VERSION" bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '>=1.25.1'
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "new-api-$VERSION"
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "new-api-arm64-$VERSION"
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.VERSION }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            new-api-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fill missing Linux assets without updating release metadata
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          version = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', version, '--repo', repo, '--json', 'assets',
          ], text=True))
          for filename in [f'new-api-{version}', f'new-api-arm64-{version}']:
              existing = [a for a in release['assets'] if a['name'] == filename]
              if existing:
                  if len(existing) != 1 or existing[0]['state'] != 'uploaded' or existing[0]['size'] <= 0:
                      raise RuntimeError(f'已有附件不完整，拒绝覆盖: {filename}')
                  print(f'保留已有附件: {filename}')
                  continue
              subprocess.run(['gh', 'release', 'upload', version, filename, '--repo', repo], check=True)
          PY
