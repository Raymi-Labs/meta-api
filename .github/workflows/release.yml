name: Release (Linux)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
      release_tag:
        description: '已有应用标签，补齐 Linux 附件并保留发布状态'
        required: false
        type: string
  push:
    tags:
      - '*'
      - '!*-alpha*'
      - '!cn-tunnel-*' # Published independently by cn-tunnel.yml
      - '!agent-workflow-*' # Published independently by agent-workflow.yml
      - '!project-decision-kit-*' # Published independently by agent-workflow.yml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  linux:
    name: Linux Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Determine Version
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
            [[ "$REQUESTED_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 1
            [[ "$(tr -d '\r\n' < VERSION)" == "$REQUESTED_RELEASE_TAG" ]] || exit 1
            VERSION="$REQUESTED_RELEASE_TAG"
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$VERSION" bun run build
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$VERSION" bun run build:docs
          cd ..
          tar -czf "new-api-docs-$VERSION.tar.gz" -C web/docs-dist .
          sha256sum "new-api-docs-$VERSION.tar.gz" > "new-api-docs-$VERSION.sha256"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
      - name: Build Backend (amd64)
        run: |
          go mod download
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "new-api-$VERSION"
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "new-api-arm64-$VERSION"
      - name: Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.compat.md").read_text()
          marker = f"## {version} —"
          if marker in changelog:
              section = changelog.split(marker, 1)[1].split("\n## ", 1)[0]
              notes = section.split("\n", 1)[1].strip()
          else:
              notes = f"发布 {version}，源码与附件对应此标签。完整更新记录见仓库 CHANGELOG.compat.md。"
          Path("/tmp/release-notes.md").write_text(notes + "\n")
          PYNOTES
            flags=()
            [[ "$VERSION" != *-* ]] || flags+=(--prerelease)
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$VERSION" --notes-file /tmp/release-notes.md "${flags[@]}"
          fi
      - name: Fill missing Linux assets without updating release metadata
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          version = os.environ['VERSION']
          repo = os.environ['GITHUB_REPOSITORY']
          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', version, '--repo', repo, '--json', 'assets',
          ], text=True))
          for filename in [f'new-api-{version}', f'new-api-arm64-{version}', f'new-api-docs-{version}.tar.gz', f'new-api-docs-{version}.sha256']:
              existing = [a for a in release['assets'] if a['name'] == filename]
              if existing:
                  if len(existing) != 1 or existing[0]['state'] != 'uploaded' or existing[0]['size'] <= 0:
                      raise RuntimeError(f'已有附件不完整，拒绝覆盖: {filename}')
                  print(f'保留已有附件: {filename}')
                  continue
              subprocess.run(['gh', 'release', 'upload', version, filename, '--repo', repo], check=True)
          PY
