name: Desktop browser login safety
on:
  push:
    branches: [main, codex/desktop-browser-login, codex/canonical-login-origin]
    paths: ["model/desktop_login*", "controller/desktop_login*", "common/login_origin*", "router/*login*", "router/web-router.go", "oauth/**", "web/src/helpers/canonicalLogin.js", "web/src/helpers/api.js", "web/src/App.jsx", "web/scripts/*login*", "web/scripts/oauth-navigation.test.mjs", "model/main.go", ".github/workflows/desktop-browser-login.yml"]
  pull_request:
    paths: ["model/desktop_login*", "controller/desktop_login*", "common/login_origin*", "router/*login*", "router/web-router.go", "oauth/**", "web/src/helpers/canonicalLogin.js", "web/src/helpers/api.js", "web/src/App.jsx", "web/scripts/*login*", "web/scripts/oauth-navigation.test.mjs", "model/main.go", ".github/workflows/desktop-browser-login.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authorization-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_DATABASE: desktop_login_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: desktop_login_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Set MySQL character set
        run: docker exec '${{ job.services.mysql.id }}' mysql -uroot -pfixture-only -e 'ALTER DATABASE desktop_login_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
      - name: Test migration, competing consumption and HTTP boundaries
        env:
          TEST_MYSQL_DSN: root:fixture-only@tcp(127.0.0.1:3306)/desktop_login_test?charset=utf8mb4&parseTime=true
          TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=fixture-only dbname=desktop_login_test sslmode=disable
        run: go test -p 2 ./model ./controller ./common ./router ./oauth -run 'TestDesktopLogin|TestCanonicalLogin|TestGoogleToken' -count=1 -timeout=180s -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test canonical navigation and OAuth parameters without real authorization
        run: node --test web/scripts/canonical-login.test.mjs web/scripts/oauth-navigation.test.mjs
